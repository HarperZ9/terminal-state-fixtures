name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  environment-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install datasets pytest
          pip install -e environments/mlflow_terminal_state
      - name: Test mlflow-terminal-state
        working-directory: environments/mlflow_terminal_state
        run: pytest tests/ -q
