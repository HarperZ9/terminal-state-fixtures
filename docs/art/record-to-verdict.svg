<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages taking one run record to a verdict: run record, launched, timeout, provider, integrity, oracle, verdict, denominator. A record carries five fields: execution with four values, provider with three, oracle with three, receipt with three and artifact with three. Every combination is enumerated, so the dataset is 324 rows with no sampling. Scoring applies eight rules in a fixed order. A blocked or never launched execution is not a run at all and leaves the denominator. A timeout reached no terminal answer and leaves it. A structured provider refusal is not a task failure and leaves it. Output that never parsed into a claim leaves it. A receipt mismatch or an artifact mismatch refutes the run even when the oracle passed, because integrity outranks the oracle, and that verdict counts. An absent oracle is an honest null rather than a pass and leaves the denominator. An oracle pass verifies and an oracle fail refutes, and both count. Seven terminal verdicts exist and only two of them, verified and refuted, belong in the quality denominator, which is 23 of the 324 rows. Three outcomes: a verdict that counts, a verdict that counts against the run, and a record excluded from the denominator entirely."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">A TRANSCRIPT SAYS WHAT A MODEL BELIEVES HAPPENED, AND THE RECORD SAYS WHAT HAPPENED</text><text class="h" x="44" y="72">How a run record becomes a verdict, or leaves the denominator</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M816.75 206V228H143.25V213"/><text class="k" x="480" y="245" text-anchor="middle" fill="var(--drift)">EXCLUSIONS ARE SETTLED FIRST</text><path class="back" marker-end="url(#ab)" d="M367.75 398V420H143.25V405"/><text class="k" x="255.5" y="437" text-anchor="middle" fill="var(--drift)">INTEGRITY OUTRANKS THE ORACLE</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Run record</text><text class="s" x="58" y="168">Five fields, every</text><text class="s" x="58" y="183">combination.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Launched</text><text class="s" x="282.5" y="168">Blocked or never started at</text><text class="s" x="282.5" y="183">all.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">Timeout</text><text class="s" x="507" y="168">No terminal answer was</text><text class="s" x="507" y="183">reached.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">Provider</text><text class="s" x="731.5" y="168">A refusal is not a task</text><text class="s" x="731.5" y="183">failure.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Integrity</text><text class="s" x="58" y="360">Receipt and artifact,</text><text class="s" x="58" y="375">compared.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">Oracle</text><text class="s" x="282.5" y="360">Pass, fail, or none to ask.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Verdict</text><text class="s" x="507" y="360">One of seven terminal states.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Denominator</text><text class="s" x="731.5" y="360">Two verdicts of the seven</text><text class="s" x="731.5" y="375">count.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H180.67V472"/><rect x="44" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">VERIFIED</text><text class="s" x="58" y="509" font-size="10.5">the oracle passed and it counts</text><path class="thin" d="M816.75 448H480V472"/><rect x="343.33" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="357.33" y="493" font-size="13">REFUTED</text><text class="s" x="357.33" y="509" font-size="10.5">it counts, and it counts against</text><path class="thin" d="M816.75 448H779.33V472"/><rect x="642.67" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/><text class="n" x="656.67" y="493" font-size="13">EXCLUDED</text><text class="s" x="656.67" y="509" font-size="10.5">not a run the score is about</text><text class="s" x="44" y="546">The order is the whole design. Every state that must not read as a quality failure is settled before the oracle is consulted, so a blocked launch, a timeout and a provider refusal leave the denominator instead of lowering the score. Integrity is checked before the oracle too, which is why a tampered record is refuted even when the oracle passed.</text></svg>
