[project]
name = "metr-terminal-state-runs"
version = "0.1.0"
description = "An exhaustive terminal-state classification TaskFamily for METR Task Standard"
requires-python = ">=3.11,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "metr-task-standard @ git+https://github.com/METR/task-standard.git@03236e9a1a0d3c9f9d63f6c9e60a9278a59d22ff#subdirectory=python-package",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["metr_terminal_state_runs.py"]
